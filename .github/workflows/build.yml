name: Build OpenVario Image

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        machine:
          - ov-cb2-ch57
          
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          
      - name: Fetch tags all
        run: |
          git fetch --tags --force

          git submodule foreach --recursive '
            git fetch --tags --force || true
          '
      - name: Show tags
        run: |
          git describe --tags || true
          git tag -l | tail  
                
      - name: Show submodule tags
        run: |
          git submodule foreach --recursive "echo === \$name === ; git describe --tags || true"
          
      - name: Verify checkout
        run: |
          ls -la
          ls -la openembedded-core

      - name: Pull Build Container
        run: |
          docker pull ghcr.io/openvario/ovbuild-container:latest

      - name: Build Yocto Image
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workdir \
            -v /opt/yocto-cache/downloads:/workdir/downloads \
            -v /opt/yocto-cache/sstate:/workdir/sstate \
            -w /workdir \
            ghcr.io/openvario/ovbuild-container:latest \
            bash -c '
              pwd
              id
              
              source openembedded-core/oe-init-build-env .
              
              pwd 
              ls -al
              
              sed -i "/^MACHINE/d" conf/local.conf
              echo "MACHINE = \"${{ matrix.machine }}\"" >> conf/local.conf
              
              bitbake u-boot
            '

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openvario-image-${{ matrix.machine }}
          path: |
            tmp/deploy/images/**
